# Addon image builder.
#
# Addon-discovery and the "did anything addon-relevant change?" check live in
# the reusable composite action at .github/actions/find-addons-filtered. Edit
# that action — not this workflow — to change which directories count as addons
# or which file globs trigger a rebuild.
name: Builder

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.addons.outputs.changed }}
      changed_apps: ${{ steps.addons.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47

      - name: Discover and filter addons
        id: addons
        uses: ./.github/actions/find-addons-filtered
        with:
          changed_files: ${{ steps.changed_files.outputs.all_changed_files }}

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
