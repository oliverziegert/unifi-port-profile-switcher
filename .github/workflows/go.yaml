name: Go

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  vet-build:
    name: Vet & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: unifi-port-profile-switcher/go.mod
          cache-dependency-path: unifi-port-profile-switcher/go.sum

      - name: go vet
        working-directory: unifi-port-profile-switcher
        run: go vet ./...

      - name: go build
        working-directory: unifi-port-profile-switcher
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: unifi-port-profile-switcher/go.mod
          cache-dependency-path: unifi-port-profile-switcher/go.sum

      - name: go test
        working-directory: unifi-port-profile-switcher
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: unifi-port-profile-switcher/coverage.out
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: unifi-port-profile-switcher/go.mod
          cache-dependency-path: unifi-port-profile-switcher/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: unifi-port-profile-switcher
          args: --config=../.golangci.yaml
