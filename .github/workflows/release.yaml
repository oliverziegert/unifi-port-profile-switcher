name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: unifi-port-profile-switcher/go.mod
          cache-dependency-path: unifi-port-profile-switcher/go.sum

      - name: Build binary
        working-directory: unifi-port-profile-switcher
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="unifi-port-profile-switcher_${version}_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "${out}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: unifi-port-profile-switcher/unifi-port-profile-switcher_*_${{ matrix.os }}_${{ matrix.arch }}
          if-no-files-found: error

  aggregate:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum unifi-port-profile-switcher_*_*_* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/unifi-port-profile-switcher_*_*_*
            dist/SHA256SUMS
